<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>TilingWM Configurator</title>
    </head>
    <body>
        <!-- mainheader start -->
        <header>
            <div>
                <div>
                </div>
                <h1>
                    TilingWM
                    <span>Configurator</span>
                </h1>
            </div>

            <nav>
                <div>
                    <span>search</span>
                    <input type="text" placeholder="Search...">
                </div>
                <div>
                    <span>account</span>
                </div>
            </nav>
        </header>
        <!-- mainheader end -->

        <!-- main content container start -->
        <div>
            <!-- sidebar start -->
            <aside>
                <nav>
                    <div>
                        <div>
                            <span>Segments</span>
                        </div>
                        <div>
                            <button type="">Main Terminal</button>
                        </div>
                        <div>
                            <button type="">Display</button>
                        </div>
                        <div>
                            <button type="">Display</button>
                        </div>
                        <div>
                            <button type="">Keyboard</button>
                        </div>
                        <div>
                            <button type="">Colors</button>
                        </div>
                        <div>
                            <button type="">Keybindings</button>
                        </div>
                    </div>
                </nav>
            </aside>
            <!-- sidebar end -->

            <!-- middle canvas start -->
            <main>
                <div>
                    <!-- terminal part start -->
                    <div>
                        <section>
                            <h3>Main Terminal</h3>
                            <select>
                                <option>Alacritty</option>
                                <option>Kitty</option>
                            </select>
                        </section>
                    </div>
                    <!-- terminal part end -->

                    <!-- display part start -->
                    <div>
                        <section>
                            <h3>Display Configuration</h3>
                            <div>
                                <div>
                                    <label for="">Resolution</label>
                                    <div>
                                        <input type="" name="" value="">
                                        <span>x</span>
                                        <input type="" name="" value="">
                                    </div>
                                </div>
                                <div>
                                    <label for="">Refresh Rate</label>
                                    <div>
                                        <input type="range" name="" value="">
                                        <span>60Hz</span>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                    <!-- display part end -->

                    <!-- colors part start -->
                    <div>
                        <section>
                            <h3>Color Profile</h3>
                            <div>
                                <div>
                                    <div>
                                        <span>Focused</span>
                                        <span>#FFFFF</span>
                                    </div>
                                    <div>
                                        <span>Focused Inactive</span>
                                        <span>#FFFFF</span>
                                    </div>
                                    <div>
                                        <span>Inactive</span>
                                        <span>#FFFFF</span>
                                    </div>
                                    <div>
                                        <span>Urgent</span>
                                        <span>#FFFFF</span>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                    <!-- colors part end -->

                    <!-- keyboard part start -->
                    <div>
                        <section>
                            <h3>Keyboard &amp; Layout</h3>
                            <div>
                                <div>
                                    <label for="">Repeat Rate</label>
                                    <input type="number" name="" value="">
                                </div>
                                <div>
                                    <label for="">Layout Options</label>
                                    <div>
                                        <input type="checkbox" name="" value="">
                                        <span>QWERTY</span>
                                    </div>
                                    <div>
                                        <input type="checkbox" name="" value="">
                                        <span>DVORAK</span>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                    <!-- keyboard part end -->

                    <!-- keybindings part start -->
                    <div>
                        <section>
                            <h3>Keybindings</h3>
                            <div>
                                <div>
                                    Action
                                </div>
                                <div>
                                    Keybind
                                </div>
                            </div>

                            <!-- container that holds the keybinds -->
                            <div>
                            </div>

                            <div>
                                <button type="">+ Add new binding</button>
                            </div>
                        </section>
                    </div>
                    <!-- keybindings part end -->
                </div>
            </main>
        </div>
        <!-- middle canvas end -->

        <!-- bottom canvas start -->
        <div>
            <footer>
                <div>
                    <button type="">Save changes</button>
                    <button type="">Download</button>
                    <button type="">Import</button>
                </div>
            </footer>
        </div>
        <!-- bottom canvas end -->

        <!-- main content container end -->
    </body>
</html>
