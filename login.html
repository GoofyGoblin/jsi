<!doctype html>

<html class="dark" lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />
        <title>Dotfiles Configurator | Operator Sign In</title>
        <link href="./src/font.css" rel="stylesheet" />
        <link href="./src/symbols.css" rel="stylesheet" />
        <link href="./src/style.css" rel="stylesheet" />
        <script src="./src/login.mts" type="module" defer></script>
        <style>
            body {
                background-color: #0c0e10;
                color: #e0e6ed;
                font-family: "Inter", sans-serif;
                -webkit-font-smoothing: antialiased;
            }
            .material-symbols-outlined {
                font-variation-settings:
                    "FILL" 0,
                    "wght" 300,
                    "GRAD" 0,
                    "opsz" 24;
            }
            input:-webkit-autofill,
            input:-webkit-autofill:hover,
            input:-webkit-autofill:focus {
                -webkit-text-fill-color: #e0e6ed;
                -webkit-box-shadow: 0 0 0px 1000px #20262c inset;
            }
        </style>
    </head>
    <body class="flex flex-col min-h-screen">
        <header class="w-full top-0 sticky bg-[#0c0e10] z-50">
            <div
                class="flex justify-between items-center h-16 px-[15%] w-full mx-auto"
            >
                <div
                    class="text-xl font-bold tracking-tight text-[#b2c5ff] font-['Space_Grotesk']"
                >
                    Dotfiles Configurator
                </div>
                <a
                    class="text-[#a6acb3] font-label text-sm hover:text-[#f9f9fc]"
                    href="register.html"
                >
                    Create Account
                </a>
            </div>
        </header>
        <main
            class="grow flex items-center justify-center px-6 py-12 relative overflow-hidden"
        >
            <div
                class="absolute top-1/4 left-[10%] w-px h-64 bg-outline-variant opacity-20"
            ></div>
            <div
                class="absolute bottom-1/4 right-[10%] w-px h-64 bg-outline-variant opacity-20"
            ></div>
            <div class="w-full max-w-md z-10">
                <div class="mb-12">
                    <h1
                        class="font-display text-4xl md:text-5xl font-medium tracking-tighter text-on-surface mb-4"
                    >
                        Login
                    </h1>
                </div>
                <form class="space-y-6">
                    <div class="space-y-2">
                        <label
                            class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-medium"
                            for="username"
                        >
                            Email
                        </label>
                        <div class="relative">
                            <input
                                class="w-full bg-surface-container-highest border-none text-on-surface px-4 py-3 text-sm rounded-DEFAULT focus:ring-1 focus:ring-primary placeholder:text-outline-variant outline-none"
                                id="login_email"
                                name="email"
                                placeholder="type your email"
                                type="text"
                                required
                            />
                        </div>
                    </div>
                    <div class="space-y-2">
                        <div class="flex justify-between items-center">
                            <label
                                class="font-label text-[10px] uppercase tracking-[0.2em] text-on-surface-variant font-medium"
                                for="password"
                            >
                                Password
                            </label>
                            <a
                                href="#"
                                class="text-[10px] uppercase tracking-widest text-primary opacity-60 hover:opacity-100"
                                >Forgot?</a
                            >
                        </div>
                        <input
                            class="w-full bg-surface-container-highest border-none text-on-surface px-4 py-3 text-sm rounded-DEFAULT focus:ring-1 focus:ring-primary placeholder:text-outline-variant outline-none"
                            id="login_password"
                            name="password"
                            placeholder="••••••••"
                            type="password"
                            required
                        />
                    </div>
                    <button
                        class="w-full bg-primary hover:bg-primary-dim text-on-primary font-display font-medium py-4 rounded-DEFAULT duration-300 mt-4 flex items-center justify-center space-x-2"
                        type="submit"
                        id="login_submit_button"
                    >
                        <span>Initiate Session</span>
                        <span
                            class="material-symbols-outlined text-lg"
                            style="
                                font-variation-settings: &quot;wght&quot; 500;
                            "
                            >login</span
                        >
                    </button>
                    <div class="text-center pt-6">
                        <p class="font-body text-xs text-on-surface-variant">
                            Don't have an account?
                            <a
                                class="text-primary hover:text-primary-dim font-medium ml-1 underline-offset-4 hover:underline"
                                href="register.html"
                                >REGISTER</a
                            >
                            <button class="bg-surface-container-highest p-2 mt-2 rounded-sm" id="google_btn">google</button>
                        </p>
                    </div>
                </form>
            </div>
        </main>
        <footer
            class="w-full py-12 bg-[#0c0e10] flex flex-col md:flex-row justify-between items-center px-[15%] opacity-60"
        >
            <div
                class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#545557] mb-4 md:mb-0"
            >
                © 2026 Dotfiles Configurator INSTRUMENTS
            </div>
            <div class="flex space-x-8">
                <a
                    class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#545557] hover:text-[#a6acb3]"
                    href="#"
                    >Security Protocol</a
                >
                <a
                    class="font-['Inter'] text-[10px] uppercase tracking-widest text-[#545557] hover:text-[#a6acb3]"
                    href="#"
                    >Privacy</a
                >
            </div>
        </footer>
    </body>
</html>
