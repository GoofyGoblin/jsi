<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Register</title>
        <link href="src/style.css" rel="stylesheet" />
        <link href="src/font.css" rel="stylesheet" />
    </head>
    <body class="bg-surface-bg">
        <header>
            <div>
                <button
                    id="theme-changer"
                    onclick="
                        document.body.classList.toggle(`dark`);
                        document.body.classList.toggle(`bg-background`);
                        document.body.classList.toggle(`bg-surface-bg`);
                    "
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        class="size-6 dark:text-on-background"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                        />
                    </svg>
                </button>
            </div>
        </header>
        <main class="flex flex-col items-center">
            <div>
                <!-- Heading section start -->
                <div class="mb-10">
                    <h1
                        class="font-headline text-5xl dark:text-white tracking-tighter"
                    >
                        Create Account
                    </h1>
                    <h1 class="font-headline"></h1>
                </div>
                <!-- Heading section end -->

                <!-- Registration form start  -->
                <div class="flex flex-col gap-5">
                    <!-- username field start -->
                    <div>
                        <label
                            for=""
                            class="font-headline text-[10px] uppercase tracking-[0.2rem]"
                            >Username</label
                        >
                        <div class="relative">
                            <input
                                class="w-100 border-none rounded-sm"
                                type="text"
                                name="username"
                                placeholder="example"
                            />
                        </div>
                    </div>
                    <!-- username field end -->

                    <!-- email field start -->
                    <div>
                        <label
                            class="font-headline text-[10px] uppercase tracking-[0.2rem]"
                            for=""
                            >Email Address</label
                        >
                        <div class="relative">
                            <input
                                class="w-100 border-none rounded-sm"
                                type="email"
                                name="email"
                                placeholder="example@mail.com"
                            />
                        </div>
                    </div>
                    <!-- email field end -->

                    <!-- password field start -->
                    <div>
                        <label
                            for="password"
                            class="font-headline text-[10px] uppercase tracking-[0.2rem]"
                            >Password</label
                        >
                        <div class="relative">
                            <input
                                type="password"
                                name="password"
                                class="w-100 border-none rounded-sm"
                            />
                        </div>
                    </div>
                    <div>
                        <label
                            for=""
                            class="font-headline text-[10px] uppercase tracking-[0.2rem]"
                            >Confirm</label
                        >
                        <div class="relative">
                            <input
                                type="password"
                                name="password"
                                class="w-100 border-none rounded-sm"
                            />
                        </div>
                    </div>
                    <!-- password field end -->

                    <!-- button section start -->
                    <button
                        type="submit"
                        class="font-headline bg-primary-dim hover:bg-primary rounded-sm w-100 p-2.5"
                    >
                        <span>Create account</span>
                    </button>
                    <!-- button section end -->
                </div>
                <!-- footer start -->
                <div class="font-headline">
                    <p>
                        Already have an account?
                        <a href="login.html#">SIGN IN</a>
                    </p>
                </div>
                <!-- footer end -->
                <!-- Registration form end  -->
            </div>
        </main>
    </body>
</html>
